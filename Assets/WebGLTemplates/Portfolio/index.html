<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水果機重構展示</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#0b111b;color:#c4d0dc;font:14px system-ui,sans-serif}main{max-width:1024px;margin:auto}#stage{position:relative;width:100%;aspect-ratio:1024/720;background:#0b111b}canvas{display:block;width:100%;height:100%;outline:none;touch-action:manipulation}#unity-loading-bar{position:absolute;inset:0;display:grid;place-content:center;gap:14px;background:#0b111b;text-align:center}progress{width:260px;accent-color:#6be8d1}#unity-warning{padding:12px;background:#572630;color:#fff;display:none}footer{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 18px;line-height:1.7}button{font:inherit;border:1px solid #35505c;color:#d6f8f1;background:#17303b;padding:9px 16px;border-radius:6px;cursor:pointer}button:focus-visible{outline:2px solid #6be8d1;outline-offset:3px}#loading-message{margin:0}@media(max-width:600px){footer{font-size:12px;align-items:flex-start}#stage{margin-top:8px}}</style></head>
<body><main><div id="unity-warning" role="alert"></div><div id="stage"><canvas id="unity-canvas" width="1024" height="720" tabindex="0" aria-label="四排水果機互動展示，按遊戲內規則按鈕可查看玩法與支付線"></canvas><div id="unity-loading-bar" role="status"><p id="loading-message">正在載入互動展示…</p><progress id="progress" max="1" value="0" aria-label="載入進度"></progress></div></div><footer><span>電腦點擊操作；手機建議橫向觀看。<br>按「規則與支付線」可查看圖案例外及 40 條路徑。</span><button id="fullscreen" disabled>全螢幕</button></footer></main>
<script>
const canvas=document.querySelector('#unity-canvas'),loading=document.querySelector('#unity-loading-bar'),message=document.querySelector('#loading-message');
function fail(){message.textContent='載入未完成，請重新整理再試。';document.querySelector('#progress').removeAttribute('value');}
const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:{{{JSON.stringify(COMPANY_NAME)}}},productName:{{{JSON.stringify(PRODUCT_NAME)}}},productVersion:{{{JSON.stringify(PRODUCT_VERSION)}}},matchWebGLToCanvasSize:false,showBanner:(text,type)=>{if(type==='error'){const warning=document.querySelector('#unity-warning');warning.textContent=text;warning.style.display='block';fail();}}};
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onerror=fail;
script.onload=()=>createUnityInstance(canvas,config,progress=>{document.querySelector('#progress').value=progress;message.textContent=progress>=.9?'正在啟動遊戲…':'正在載入互動展示… '+Math.round(progress*100)+'%';}).then(instance=>{loading.style.display='none';const fullscreen=document.querySelector('#fullscreen');fullscreen.disabled=false;fullscreen.onclick=()=>instance.SetFullscreen(1);}).catch(fail);
document.body.appendChild(script);
</script></body></html>
